{{- if .Values.httproute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Release.Name }}-httproute
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: {{ .Values.httproute.gateway.name | default "main-gateway" }}
      namespace: {{ .Values.httproute.gateway.namespace | default "default" }}
  hostnames:
    - {{ .Values.httproute.host }}
  rules:
    - matches:
        - path:
            type: {{ .Values.httproute.pathType | default "PathPrefix" }}
            value: {{ .Values.httproute.path | default "/" }}
      backendRefs:
        - group: ""
          kind: Service
          name: {{ .Release.Name }}
          port: {{ .Values.service.port }}
          weight: 1
{{- end }}
